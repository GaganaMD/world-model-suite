# Reproducibility manifest for the preserved three-run game POSG study.
# This file consolidates the immutable fields stored in run_*/00_run_info/config.json
# and the request construction in experiments/run_hardened_openrouter_game_study.py.
# It contains no credentials.

study: hardened_openrouter_game_posg
analysis_unit: first-pass candidate

models:
  - key: gpt_5_6_sol
    id: openai/gpt-5.6-sol
  - key: claude_opus_5
    id: anthropic/claude-opus-5
  - key: llama_3_3_70b
    id: meta-llama/llama-3.3-70b-instruct
  - key: qwen_3_8_27b
    id: qwen/qwen3.8-27b
  - key: deepseek_v4_flash
    id: deepseek/deepseek-v4-flash-0731

cases: [G1, G2, G3, G4, G5, G6, G7, G8, G9]

generation:
  temperature: 0
  max_tokens: 16384
  reasoning_enabled: false
  request_seed: null  # No seed field was sent or recorded for these requests.
  samples_per_case_per_run: 1
  strict_string_identifiers: true

prompting:
  first_pass_template: SYSTEM_PROMPT + USER_TEMPLATE(case_description)
  prompt_variants_across_runs: false
  repeat_definition: >-
    For each model--case pair, run_1, run_2, and run_3 are three separate
    first-pass provider requests using the same preserved system and user
    prompt. They are repeated samples, not prompt variants.

runs:
  - id: game-posg-20260829-hardened
    directory: run_1
    max_repair_rounds: 3
  - id: run_2
    directory: run_2
    max_repair_rounds: 3
  - id: run_3
    directory: run_3
    max_repair_rounds: 10

analysis_policy:
  first_pass_only: true
  first_pass_tag_suffix: r0
  repairs_retained_separately: true
  repairs_substituted_into_first_pass_analysis: false

provenance:
  per_run_config_files:
    - run_1/00_run_info/config.json
    - run_2/00_run_info/config.json
    - run_3/00_run_info/config.json
  runner: ../../run_hardened_openrouter_game_study.py
